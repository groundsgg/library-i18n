name: Crowdin Sync

# Reusable workflow. A plugin that ships message bundles calls it instead of
# wiring the Crowdin action itself:
#
#   jobs:
#     crowdin:
#       uses: groundsgg/library-i18n/.github/workflows/crowdin-sync.yml@main
#       secrets: inherit
#
# Sources go up on every push to main; translations come back as a pull request
# on a schedule, so a translator's work never lands without review.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Matches the org default used by gradle-ci."
        required: false
        type: string
        default: blacksmith-4vcpu-ubuntu-2404-arm
      config:
        description: "Path to the crowdin.yml describing this repository's bundles."
        required: false
        type: string
        default: crowdin.yml
      upload_sources:
        description: "Push source strings to Crowdin."
        required: false
        type: boolean
        default: true
      download_translations:
        description: "Pull finished translations back and open a pull request."
        required: false
        type: boolean
        default: true
    secrets:
      CROWDIN_PROJECT_ID:
        description: "Numeric id of the Crowdin project. Set once at org level."
        required: true
      CROWDIN_PERSONAL_TOKEN:
        description: "Crowdin personal access token. Set once at org level."
        required: true

jobs:
  sync:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Sync with Crowdin
        uses: crowdin/github-action@v2
        with:
          config: ${{ inputs.config }}
          upload_sources: ${{ inputs.upload_sources }}
          # Translations are authored in Crowdin, never in the repository. Uploading
          # them back would let a hand-edited bundle overwrite a translator's work.
          upload_translations: false
          download_translations: ${{ inputs.download_translations }}
          localization_branch_name: chore/crowdin-translations
          create_pull_request: true
          pull_request_title: "chore(i18n): sync translations from Crowdin"
          pull_request_body: |
            Automated download from Crowdin. Merging updates the bundled translations.
          commit_message: "chore(i18n): sync translations from Crowdin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
